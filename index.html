
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS_TRACKER</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #182230;
        }

        header {
            padding: 18px 24px;
            background: #ffffff;
            border-bottom: 1px solid #dfe5eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: #64748b;
        }

        .status {
            font-size: 13px;
            padding: 9px 12px;
            border-radius: 6px;
            white-space: nowrap;
            background: #f1f5f9;
            color: #475569;
        }

        .status.online {
            background: #dcfce7;
            color: #166534;
        }

        .status.offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.waiting {
            background: #fef3c7;
            color: #92400e;
        }

        .status.error {
            background: #ffedd5;
            color: #9a3412;
        }

        .info {
            margin: 16px 20px;
            padding: 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 7px;
        }

        .value {
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        #map {
            height: calc(100vh - 180px);
            min-height: 380px;
            margin: 0 20px 20px;
            border: 1px solid #dfe5eb;
            border-radius: 8px;
            z-index: 1;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px;
                align-items: flex-start;
            }

            h1 {
                font-size: 18px;
            }

            .info {
                margin: 12px;
                padding: 12px;
                gap: 8px;
            }

            .value {
                font-size: 12px;
            }

            #map {
                margin: 0 12px 12px;
                height: 65vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>GPS_TRACKER</h1>
            <div class="subtitle">Live GPS location</div>
        </div>

        <div id="status" class="status waiting">
            Connecting...
        </div>
    </header>

    <section class="info">

        <div>
            <div class="label">Latitude</div>
            <div id="latitude" class="value">Waiting...</div>
        </div>

        <div>
            <div class="label">Longitude</div>
            <div id="longitude" class="value">Waiting...</div>
        </div>

        <div>
            <div class="label">Last update</div>
            <div id="updated" class="value">Waiting...</div>
        </div>

    </section>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const initialPosition = [13.166982, 77.557630];

        const map = L.map("map").setView(initialPosition, 16);

        const streetLayer = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        );

        const satelliteLayer = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community"
            }
        );

        streetLayer.addTo(map);

        L.control.layers(
            {
                "Street Map": streetLayer,
                "Satellite View": satelliteLayer
            },
            null,
            {
                position: "topright",
                collapsed: false
            }
        ).addTo(map);

        let marker = null;
        let lastCoordinates = null;

        function setStatus(message, className) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.className = "status " + className;
        }

        async function updateLocation() {

            try {
                const response = await fetch(
                    "/location?t=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("Server returned " + response.status);
                }

                const data = await response.json();

                const hasCoordinates =
                    typeof data.latitude === "number" &&
                    typeof data.longitude === "number";

                if (!hasCoordinates) {
                    setStatus("Waiting for GPS", "waiting");

                    document.getElementById("latitude").textContent = "Waiting...";
                    document.getElementById("longitude").textContent = "Waiting...";
                    document.getElementById("updated").textContent = "Waiting...";

                    return;
                }

                const position = [
                    data.latitude,
                    data.longitude
                ];

                document.getElementById("latitude").textContent =
                    data.latitude.toFixed(6);

                document.getElementById("longitude").textContent =
                    data.longitude.toFixed(6);

                if (data.updated_at !== null) {
                    document.getElementById("updated").textContent =
                        new Date(data.updated_at * 1000).toLocaleTimeString();
                }

                if (data.is_online) {
                    setStatus("GPS Connected", "online");
                } else {
                    setStatus("GPS Disconnected", "offline");
                }

                if (!marker) {
                    marker = L.circleMarker(position, {
                        radius: 9,
                        color: "#ffffff",
                        weight: 3,
                        fillColor: "#168653",
                        fillOpacity: 1
                    }).addTo(map);

                    marker.bindPopup("GPS Tracker Location");

                    map.setView(position, 16);

                } else {
                    marker.setLatLng(position);

                    marker.setPopupContent(
                        "GPS Tracker Location<br>" +
                        "Latitude: " + data.latitude.toFixed(6) + "<br>" +
                        "Longitude: " + data.longitude.toFixed(6)
                    );

                    const moved = !lastCoordinates ||
                        map.distance(lastCoordinates, position) > 10;

                    if (moved) {
                        map.panTo(position);
                    }
                }

                lastCoordinates = position;

            } catch (error) {
                setStatus("Server Disconnected", "error");
                console.error("Location update failed:", error);
            }
        }

        updateLocation();
        setInterval(updateLocation, 2000);

    </script>

</body>
</html>

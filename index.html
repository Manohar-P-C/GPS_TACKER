
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Bus Tracker</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #182230;
        }

        header {
            padding: 18px 24px;
            background: #ffffff;
            border-bottom: 1px solid #dfe5eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: #64748b;
        }

        .status {
            font-size: 13px;
            padding: 9px 12px;
            background: #fff7ed;
            color: #9a3412;
            border-radius: 6px;
            white-space: nowrap;
        }

        .status.online {
            background: #dcfce7;
            color: #166534;
        }

        .info {
            margin: 16px 20px;
            padding: 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 7px;
        }

        .value {
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        #map {
            height: calc(100vh - 180px);
            min-height: 380px;
            margin: 0 20px 20px;
            border: 1px solid #dfe5eb;
            border-radius: 8px;
            z-index: 1;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px;
                align-items: flex-start;
            }

            h1 {
                font-size: 18px;
            }

            .info {
                margin: 12px;
                padding: 12px;
                gap: 8px;
            }

            .value {
                font-size: 12px;
            }

            #map {
                margin: 0 12px 12px;
                height: 65vh;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>College Bus Tracker</h1>
            <div class="subtitle">Live GPS location</div>
        </div>
        <div id="status" class="status">Connecting...</div>
    </header>

    <section class="info">
        <div>
            <div class="label">Latitude</div>
            <div id="latitude" class="value">Waiting...</div>
        </div>

        <div>
            <div class="label">Longitude</div>
            <div id="longitude" class="value">Waiting...</div>
        </div>

        <div>
            <div class="label">Last update</div>
            <div id="updated" class="value">Waiting...</div>
        </div>
    </section>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initial map position: your latest reported GPS location
        const initialPosition = [13.166982, 77.557630];

        const map = L.map("map").setView(initialPosition, 16);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const busIcon = L.divIcon({
            className: "",
            html: `
                <div style="
                    width: 38px;
                    height: 38px;
                    background: #166534;
                    border: 3px solid white;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 2px 8px #0005;
                    font-size: 20px;
                ">🚌</div>
            `,
            iconSize: [38, 38],
            iconAnchor: [19, 19]
        });

        const marker = L.marker(initialPosition, {
            icon: busIcon
        }).addTo(map);

        marker.bindPopup("College bus GPS location");

        let lastCoordinates = null;

        async function updateLocation() {
            const status = document.getElementById("status");

            try {
                const response = await fetch(
                    "/location?t=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("Server returned " + response.status);
                }

                const data = await response.json();

                if (
                    typeof data.latitude !== "number" ||
                    typeof data.longitude !== "number"
                ) {
                    status.textContent = "Waiting for GPS";
                    status.className = "status";
                    return;
                }

                const position = [data.latitude, data.longitude];

                document.getElementById("latitude").textContent =
                    data.latitude.toFixed(6);

                document.getElementById("longitude").textContent =
                    data.longitude.toFixed(6);

                document.getElementById("updated").textContent =
                    new Date().toLocaleTimeString();

                status.textContent = "GPS Connected";
                status.className = "status online";

                marker.setLatLng(position);
                marker.setPopupContent(
                    `Bus location<br>
                     Latitude: ${data.latitude.toFixed(6)}<br>
                     Longitude: ${data.longitude.toFixed(6)}`
                );

                // Center on the first received location.
                // Follow subsequent movement only when the bus moves.
                const moved = !lastCoordinates ||
                    map.distance(lastCoordinates, position) > 10;

                if (!lastCoordinates) {
                    map.setView(position, 16);
                } else if (moved) {
                    map.panTo(position);
                }

                lastCoordinates = position;

            } catch (error) {
                status.textContent = "Server disconnected";
                status.className = "status";
                console.error("Location update failed:", error);
            }
        }

        updateLocation();
        setInterval(updateLocation, 2000);
    </script>
</body>
</html>

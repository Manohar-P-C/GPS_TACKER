
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS_TRACKER | Live GPS Location</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --paper: #faf6eb;
            --ink: #273c38;
            --muted: #718078;
            --coral: #e88d87;
            --blue: #91bed0;
            --green: #9fc6a0;
            --yellow: #f3d58b;
            --line: #d8d0bd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Nunito", sans-serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(#d7cdbb 0.55px, transparent 0.55px);
            background-size: 9px 9px;
        }

        .page {
            width: min(1500px, 100%);
            margin: auto;
            padding: 24px 34px 30px;
        }

        /* Header */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 23px;
            padding: 5px 3px 17px;
            border-bottom: 2px solid #d9d0bd;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-icon {
            width: 49px;
            height: 49px;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-family: "Kalam", cursive;
            font-size: clamp(27px, 3vw, 39px);
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .brand-name {
            display: inline-block;
            position: relative;
        }

        .brand-name::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -5px;
            height: 4px;
            background: #83b99a;
            border-radius: 50%;
            transform: rotate(-1deg);
        }

        .subtitle {
            margin-top: 8px;
            font-family: "Kalam", cursive;
            font-size: 17px;
            color: #697a73;
        }

        /* Connection status */

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 19px;
            border: 2px solid #d9cda9;
            border-radius: 24px 19px 22px 17px;
            background: #fff1c9;
            color: #8c6525;
            font-family: "Kalam", cursive;
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
            transform: rotate(-0.5deg);
        }

        .status-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #d8a53e;
            flex-shrink: 0;
        }

        .status.online {
            background: #e1f1df;
            border-color: #b4d3ad;
            color: #347449;
        }

        .status.online .status-dot {
            background: #39945a;
        }

        .status.offline {
            background: #fbe4df;
            border-color: #e8b7ae;
            color: #a34d45;
        }

        .status.offline .status-dot {
            background: #cf665c;
        }

        .status.error {
            background: #fbe8d9;
            border-color: #e9c5a5;
            color: #a45d2e;
        }

        .status.error .status-dot {
            background: #cf8042;
        }

        /* Information cards */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 17px;
            margin-bottom: 23px;
        }

        .info-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 105px;
            padding: 15px 20px;
            background: #fffaf0;
            border: 2px solid var(--line);
            border-radius: 13px 17px 12px 16px;
            box-shadow: 2px 3px 0 rgba(90, 75, 50, 0.06);
        }

        .info-card.latitude {
            border-color: #e7b6ad;
            transform: rotate(-0.3deg);
        }

        .info-card.longitude {
            border-color: #a8cbd6;
            transform: rotate(0.25deg);
        }

        .info-card.updated {
            border-color: #b6cdb1;
            transform: rotate(-0.2deg);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 50%;
            background: #f7e5df;
        }

        .longitude .card-icon {
            background: #e3eff2;
        }

        .updated .card-icon {
            background: #e8efe1;
        }

        .card-icon svg {
            width: 27px;
            height: 27px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .latitude .card-icon {
            color: #ce7770;
        }

        .longitude .card-icon {
            color: #5894a7;
        }

        .updated .card-icon {
            color: #6d9b72;
        }

        .label {
            margin-bottom: 2px;
            font-family: "Kalam", cursive;
            font-size: 17px;
            color: #61746d;
        }

        .value {
            font-size: 19px;
            font-weight: 800;
            color: #273c38;
            overflow-wrap: anywhere;
        }

        /* Map */

        .map-paper {
            position: relative;
            padding: 13px;
            background: #fff9eb;
            border: 2px solid #cfc4ad;
            border-radius: 13px 17px 14px 16px;
            box-shadow: 3px 4px 0 rgba(80, 65, 45, 0.09);
        }

        .map-paper::before,
        .map-paper::after {
            content: "";
            position: absolute;
            z-index: 5;
            width: 65px;
            height: 21px;
            background: rgba(239, 207, 151, 0.72);
            border: 1px solid rgba(190, 160, 105, 0.35);
            transform: rotate(-35deg);
        }

        .map-paper::before {
            top: -5px;
            left: -17px;
        }

        .map-paper::after {
            right: -17px;
            bottom: -5px;
            transform: rotate(-35deg);
        }

        #map {
            width: 100%;
            height: min(66vh, 690px);
            min-height: 400px;
            border: 1px solid #d4c9b5;
            border-radius: 8px;
            z-index: 1;
            background: #e9e4d8;
        }

        /* Leaflet controls */

        .leaflet-control-layers {
            border: 2px solid #d7cdb9 !important;
            border-radius: 9px !important;
            background: #fffaf0 !important;
            font-family: "Nunito", sans-serif;
            box-shadow: 2px 3px 5px #00000015 !important;
        }

        .leaflet-control-zoom a {
            background: #fffaf0 !important;
            color: #354c44 !important;
        }

        .leaflet-control-zoom {
            border: 2px solid #d7cdb9 !important;
            overflow: hidden;
            border-radius: 8px !important;
        }

        .leaflet-control-attribution {
            font-size: 10px !important;
        }

        /* Custom location marker */

        .tracker-marker {
            width: 38px;
            height: 38px;
            position: relative;
            display: grid;
            place-items: center;
            border: 3px solid white;
            border-radius: 50%;
            background: #5b9d77;
            box-shadow: 0 2px 8px #0004;
        }

        .tracker-marker::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            border: 2px solid #35734e;
        }

        .tracker-marker.offline-marker {
            background: #c96f64;
        }

        .tracker-marker.offline-marker::before {
            border-color: #a94c45;
        }

        /* Footer */

        .footer {
            text-align: center;
            padding: 15px 0 0;
            color: #89938a;
            font-family: "Kalam", cursive;
            font-size: 13px;
        }

        /* Mobile layout: compact journal-style presentation only */
        @media (max-width: 650px) {
            .page {
                padding: 11px 10px 16px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 7px;
                margin-bottom: 12px;
                padding: 2px 2px 10px;
            }

            .brand {
                gap: 8px;
            }

            .brand-icon {
                width: 34px;
                height: 34px;
            }

            h1 {
                font-size: clamp(23px, 6.5vw, 27px);
                line-height: 1.05;
            }

            .brand-name::after {
                bottom: -3px;
                height: 3px;
            }

            .subtitle {
                margin-top: 5px;
                font-size: 14px;
            }

            .status {
                width: auto;
                max-width: 100%;
                justify-content: flex-start;
                gap: 7px;
                padding: 5px 12px;
                border-radius: 16px 13px 15px 12px;
                font-size: 14px;
                transform: rotate(-0.25deg);
            }

            .status-dot {
                width: 8px;
                height: 8px;
            }

            /* Three compact cards keep all GPS data visible above the map. */
            .info-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 7px;
                margin-bottom: 12px;
            }

            .info-card {
                min-width: 0;
                min-height: 91px;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                gap: 5px;
                padding: 8px 7px;
                border-radius: 11px 13px 10px 12px;
                transform: none !important;
            }

            .card-icon {
                width: 27px;
                height: 27px;
            }

            .card-icon svg {
                width: 17px;
                height: 17px;
            }

            .label {
                margin-bottom: 0;
                font-size: 12px;
                line-height: 1.15;
            }

            .value {
                font-size: clamp(12px, 3.5vw, 14px);
                line-height: 1.2;
                overflow-wrap: anywhere;
            }

            .map-paper {
                padding: 6px;
                border-radius: 12px 15px 12px 14px;
            }

            .map-paper::before,
            .map-paper::after {
                width: 43px;
                height: 14px;
            }

            .map-paper::before {
                top: -4px;
                left: -10px;
            }

            .map-paper::after {
                right: -10px;
                bottom: -4px;
            }

            #map {
                height: 50vh;
                min-height: 290px;
                max-height: 460px;
                border-radius: 7px;
            }

            .leaflet-control-layers {
                font-size: 12px;
                max-width: 155px;
            }

            .leaflet-control-layers label {
                white-space: nowrap;
            }

            .leaflet-control-zoom a {
                width: 29px !important;
                height: 29px !important;
                line-height: 29px !important;
            }

            .leaflet-control-attribution {
                font-size: 9px !important;
            }

            .footer {
                padding-top: 9px;
                font-size: 12px;
            }
        }

        @media (max-width: 370px) {
            .page {
                padding-right: 8px;
                padding-left: 8px;
            }

            .info-grid {
                gap: 5px;
            }

            .info-card {
                padding: 7px 5px;
            }

            .label {
                font-size: 11px;
            }

            .value {
                font-size: 12px;
            }

            .leaflet-control-layers {
                max-width: 143px;
                padding: 5px !important;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <header>

            <div class="brand">

                <svg class="brand-icon" viewBox="0 0 48 48"
                    aria-hidden="true">
                    <path d="M24 43 C20 34 9 24 9 17
                             C9 8 15 3 24 3
                             C33 3 39 9 39 17
                             C39 25 28 36 24 43Z"
                        fill="#ed928b" stroke="#344b43"
                        stroke-width="2.2"
                        stroke-linejoin="round"/>
                    <circle cx="24" cy="17" r="6"
                        fill="#fff7ec" stroke="#344b43"
                        stroke-width="1.8"/>
                </svg>

                <div>
                    <h1><span class="brand-name">GPS_TRACKER</span></h1>
                    <div class="subtitle">Live GPS location</div>
                </div>

            </div>

            <div id="status" class="status">
                <span class="status-dot"></span>
                <span id="statusText">Waiting for GPS</span>
            </div>

        </header>


        <section class="info-grid">

            <article class="info-card latitude">

                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 10c0 5-8 12-8 12S4 15 4 10
                                 a8 8 0 1 1 16 0Z"/>
                        <circle cx="12" cy="10" r="2.5"/>
                    </svg>
                </div>

                <div>
                    <div class="label">Latitude</div>
                    <div id="latitude" class="value">Waiting...</div>
                </div>

            </article>


            <article class="info-card longitude">

                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20M12 2
                                 c3 3 4 6 4 10
                                 s-1 7-4 10
                                 c-3-3-4-6-4-10
                                 s1-7 4-10Z"/>
                    </svg>
                </div>

                <div>
                    <div class="label">Longitude</div>
                    <div id="longitude" class="value">Waiting...</div>
                </div>

            </article>


            <article class="info-card updated">

                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>

                <div>
                    <div class="label">Last update</div>
                    <div id="updated" class="value">Waiting...</div>
                </div>

            </article>

        </section>


        <section class="map-paper">
            <div id="map"></div>
        </section>


        <div class="footer">
            GPS_TRACKER · Live location monitoring
        </div>

    </main>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // Initial map position
        const initialPosition = [13.166982, 77.557630];

        const map = L.map("map", {
            zoomControl: true
        }).setView(initialPosition, 16);


        // Street map
        const streetLayer = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        );


        // Satellite map
        const satelliteLayer = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics"
            }
        );


        // Default map layer
        streetLayer.addTo(map);


        // Map layer switcher
        L.control.layers(
            {
                "Street Map": streetLayer,
                "Satellite View": satelliteLayer
            },
            null,
            {
                position: "topright",
                collapsed: false
            }
        ).addTo(map);


        // Custom marker without emoji
        function createTrackerIcon(online) {

            return L.divIcon({
                className: "",
                html: `<div class="tracker-marker ${online ? "" : "offline-marker"}"></div>`,
                iconSize: [38, 38],
                iconAnchor: [19, 19]
            });
        }


        let marker = null;
        let lastCoordinates = null;
        let hasCentered = false;


        function setStatus(message, state) {

            const status = document.getElementById("status");

            status.className = "status " + state;

            document.getElementById("statusText").textContent = message;
        }


        async function updateLocation() {

            try {

                const response = await fetch(
                    "/location?t=" + Date.now(),
                    {
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    throw new Error("Server returned " + response.status);
                }

                const data = await response.json();


                // No GPS location received yet
                const hasCoordinates =
                    typeof data.latitude === "number" &&
                    typeof data.longitude === "number";

                if (!hasCoordinates) {

                    setStatus("Waiting for GPS", "waiting");

                    document.getElementById("latitude").textContent = "Waiting...";
                    document.getElementById("longitude").textContent = "Waiting...";
                    document.getElementById("updated").textContent = "Waiting...";

                    return;
                }


                // Display coordinates
                document.getElementById("latitude").textContent =
                    data.latitude.toFixed(6);

                document.getElementById("longitude").textContent =
                    data.longitude.toFixed(6);


                // Display actual GPS update time
                if (data.updated_at !== null) {

                    document.getElementById("updated").textContent =
                        new Date(data.updated_at * 1000)
                            .toLocaleTimeString();

                }


                // Actual connection status from Render
                const online = data.is_online === true;

                if (online) {
                    setStatus("GPS Connected", "online");
                } else {
                    setStatus("GPS Disconnected", "offline");
                }


                // Update map marker
                const position = [
                    data.latitude,
                    data.longitude
                ];

                if (!marker) {

                    marker = L.marker(position, {
                        icon: createTrackerIcon(online)
                    }).addTo(map);

                    marker.bindPopup("GPS_TRACKER location");

                } else {

                    marker.setLatLng(position);
                    marker.setIcon(createTrackerIcon(online));

                }


                // Center on first valid location
                // Follow movement only when position changes
                const moved = !lastCoordinates ||
                    map.distance(lastCoordinates, position) > 10;

                if (!hasCentered) {

                    map.setView(position, 16);
                    hasCentered = true;

                } else if (moved) {

                    map.panTo(position);

                }

                lastCoordinates = position;


            } catch (error) {

                setStatus("Server Disconnected", "error");

                console.error("Location update failed:", error);

            }

        }


        // Initial update
        updateLocation();


        // Refresh GPS information every 2 seconds
        setInterval(updateLocation, 2000);


    </script>

</body>
</html>
